name: Test and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m installtrace demo --out demo-report.html
  windows-build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke-test standalone executable
        shell: pwsh
        run: ./Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InstallTrace-Windows-x64-unsigned
          path: |
            dist/InstallTrace.exe
            dist/SHA256SUMS.txt
            dist/smoke-test.json
          if-no-files-found: error

  publish:
    needs: windows-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InstallTrace-Windows-x64-unsigned
          path: release
      - name: Publish initial tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; leaving published binaries unchanged.'
          else
            gh release create v0.1.0 release/InstallTrace.exe release/SHA256SUMS.txt release/smoke-test.json --target "$GITHUB_SHA" --prerelease --title "InstallTrace 0.1.0 Preview" --notes-file RELEASE-NOTES.md
          fi
