[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "installtrace"
version = "0.1.0"
description = "Read-only Windows installation snapshots, comparisons and leftover candidates"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
installtrace = "installtrace.__main__:main"

[tool.setuptools.packages.find]
include = ["installtrace*"]
